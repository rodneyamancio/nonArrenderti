# Tenace (/opt/tenace) on the host nginx. The web listens on 127.0.0.1:3310 (WEB_PORT).
# Certificate via certbot webroot (see tenace.http-only.conf).
server {
    listen 80;
    listen [::]:80;
    server_name tenace.amancio.family;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tenace-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://tenace.amancio.family$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tenace.amancio.family;

    ssl_certificate /etc/letsencrypt/live/tenace.amancio.family/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenace.amancio.family/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TenaceTLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/tenace.access.log;
    error_log /var/log/nginx/tenace.error.log warn;

    # Photos are resized in the browser (≤ 5 MB accepted by the API).
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrites the client's X-Forwarded-For: the API uses the IP for login rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
