# Step 1 (before the certificate): ACME only. Replace with tenace.conf after certbot.
#   certbot certonly --webroot -w /var/www/tenace-acme -d tenace.amancio.family --deploy-hook "nginx -t && systemctl reload nginx"
server {
    listen 80;
    listen [::]:80;
    server_name tenace.amancio.family;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tenace-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
